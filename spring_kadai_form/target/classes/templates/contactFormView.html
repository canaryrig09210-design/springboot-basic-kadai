<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>お問い合わせフォーム</title>
</head>
<body>

<h1>お問い合わせフォーム</h1>

<form th:action="@{/confirm}" th:object="${contactForm}" method="post">
    <table>

        <!-- お名前 -->
        <tr>
            <td><label for="name">お名前</label></td>
            <td>
                <input type="text" id="name" th:field="*{name}">
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></div>
            </td>
        </tr>

        <!-- メールアドレス -->
        <tr>
            <td><label for="email">メールアドレス</label></td>
            <td>
                <input type="email" id="email" th:field="*{email}">
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red"></div>
            </td>
        </tr>

        <!-- お問い合わせ内容 -->
        <tr>
            <td><label for="message">お問い合わせ内容</label></td>
            <td>
                <textarea id="message" th:field="*{message}" rows="10" cols="40"></textarea>
                <div th:if="${#fields.hasErrors('message')}" th:errors="*{message}" style="color:red"></div>
            </td>
        </tr>

        <!-- 送信ボタン -->
        <tr>
            <td>
                <input type="submit" value="送信">
            </td>
        </tr>

    </table>
</form>

</body>
</html>
